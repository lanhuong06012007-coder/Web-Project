{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-4 bg-white p-4 rounded shadow-sm">
        <h4 class="mb-4 text-center fw-bold text-success">
            {% if form_type == 'login' %} ĐĂNG NHẬP HỆ THỐNG {% else %} ĐĂNG KÝ TÀI KHOẢN {% endif %}
        </h4>
        <form method="POST" action="{% if form_type == 'login' %}{{ url_for('auth.login') }}{% else %}{{ url_for('auth.register') }}{% endif %}">
            <div class="mb-3">
                <label class="form-label fw-bold">Tên tài khoản</label>
                <input type="text" name="username" class="form-control" placeholder="Nhập username..." required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">Mật khẩu</label>
                <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu..." required>
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold py-2 mb-3">
                {% if form_type == 'login' %} Đăng nhập ngay {% else %} Đăng ký tài khoản {% endif %}
            </button>
            <div class="text-center">
                {% if form_type == 'login' %}
                    <small>Chưa có tài khoản? <a href="{{ url_for('auth.register') }}" class="text-primary">Đăng ký tại đây</a></small>
                {% else %}
                    <small>Đã có tài khoản rồi? <a href="{{ url_for('auth.login') }}" class="text-primary">Đăng nhập ngay</a></small>
                {% endif %}
            </div>
        </form>
    </div>
</div>
{% endblock %}
